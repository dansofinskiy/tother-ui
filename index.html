<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск редактора</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .forms-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .results-container {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .results-container.show {
            display: block;
        }

        .results-container h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .load-more-btn {
            margin-top: 15px;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.8;
            font-size: 0.9em;
            padding: 10px;
        }

        .load-more-btn:hover {
            opacity: 1;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 500;
            margin: 20px 0;
        }

        .loading.show {
            display: block !important;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: none;
        }

        .error.show {
            display: block;
        }

        .notification {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            display: none;
            border-left: 4px solid #4caf50;
        }

        .notification.show {
            display: block;
        }

        .results-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .results-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .result-list {
            list-style: none;
        }

        .result-item {
            padding: 15px;
            margin-bottom: 15px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .result-item:hover {
            background: #f0f0f0;
        }

        .player-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .copy-id-btn {
            padding: 6px 10px;
            border: 1px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 5px;
            font-size: 0.9em;
            cursor: pointer;
            white-space: nowrap;
            width: auto;
        }

        .copy-id-btn:hover {
            background: #f0f4ff;
        }

        .player-link {
            text-decoration: none;
            color: #667eea;
            font-weight: 500;
            transition: color 0.2s;
            display: block;
            padding: 5px 0;
        }

        .player-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .player-item .item-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .item-detail {
            color: #666;
            font-size: 0.95em;
            margin: 4px 0;
        }

        .detail-label {
            font-weight: 500;
            color: #555;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 1em;
        }

        .stats {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #555;
        }

        .stats-item {
            margin: 5px 0;
        }

        .tournament-button {
            margin-top: 10px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
            width: auto;
        }

        .tournament-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .tournament-button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .forms-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .form-card {
                padding: 20px;
            }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Играл ли я этого редактора?</h1>

        <div class="forms-section">
            <!-- Form 1: Player Search -->
            <div class="form-card">
                <h2>🔍 Поиск ID</h2>
                <form id="playerForm">
                    <div class="form-group">
                        <label for="surname">Игрок</label>
                        <input
                            type="text"
                            id="surname"
                            name="surname"
                            placeholder="e.g., Рождествин или Иванов Михаил"
                            required
                        >
                    </div>
                    <div class="checkbox-group">
                        <input
                            type="checkbox"
                            id="isEditor"
                            name="isEditor"
                            checked
                        >
                        <label for="isEditor">Только редакторы</label>
                    </div>
                    <button type="submit">Искать</button>
                </form>
                <div class="loading" id="playerLoading">
                    <span class="spinner"></span>Поиск...
                </div>
                <div class="error" id="playerError"></div>

                <!-- Player Results -->
                <div class="results-container" id="playerResultsContainer">
                    <h3>Результат</h3>
                    <div id="playersResultsList"></div>
                    <button type="button" id="loadMorePlayersBtn" class="load-more-btn" style="display: none;">
                        ➕ Искать ещё
                    </button>
                    <div class="loading" id="playerLoadingBottom" style="display: none;">
                        <span class="spinner"></span>Поиск...
                    </div>
                    <div class="notification" id="playerNotification"></div>
                </div>
            </div>

            <!-- Form 2: Tournament Intersection -->
            <div class="form-card">
                <h2>⚡ Сыгранные турниры</h2>
                <form id="intersectionForm">
                    <div class="form-group">
                        <label for="playerId">Ваш ID</label>
                        <input
                            type="number"
                            id="playerId"
                            name="playerId"
                            placeholder="e.g., 1234"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="editorId">ID редактора</label>
                        <input
                            type="number"
                            id="editorId"
                            name="editorId"
                            placeholder="e.g., 27009"
                            required
                        >
                    </div>
                    <button type="submit">Искать турниры</button>
                </form>
                <div class="loading" id="intersectionLoading">
                    <span class="spinner"></span>Поиск...
                </div>
                <div class="error" id="intersectionError"></div>

                <!-- Tournament Results -->
                <div class="results-container" id="tournamentResultsContainer">
                    <h3>Результаты</h3>
                    <div id="tournamentsResultsList"></div>
                    <button type="button" id="loadMoreTournamentsBtn" class="load-more-btn" style="display: none;">
                        ➕ Искать ещё
                    </button>
                    <div class="loading" id="intersectionLoadingBottom" style="display: none;">
                        <span class="spinner"></span>Поиск...
                    </div>
                    <div class="notification" id="intersectionNotification"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://jmdw1qbyh8.execute-api.eu-north-1.amazonaws.com/tother-app'; // Change this to your Lambda API endpoint

        // State for player search pagination
        let currentPlayerPage = 1;
        let currentPlayerQuery = {
            surname: '',
            name: null,
            isEditor: false
        };

        // State for tournament intersection pagination
        let currentTournamentPage = 1;
        let currentTournamentQuery = {
            playerId: 0,
            editorId: 0
        };

        // Track if search buttons can be clicked
        let playerSearchDirty = false;
        let intersectionSearchDirty = false;

        // Player Form Handler
        document.getElementById('playerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset pagination and clear previous results
            currentPlayerPage = 1;
            const inputText = document.getElementById('surname').value.trim();
            const isEditor = document.getElementById('isEditor').checked;

            // Split input by space - first word is surname, second is name
            const parts = inputText.split(/\s+/);
            const surname = parts[0];
            const name = parts.length > 1 ? parts[1] : null;

            // Store current query for pagination
            currentPlayerQuery = { surname, name, isEditor };

            // Reset dirty flag after successful search
            playerSearchDirty = false;
            updatePlayerSearchButton();

            showLoading('player');
            clearError('player');
            clearNotification('player');

            try {
                const players = await fetchPlayers(surname, name, isEditor, currentPlayerPage);
                displayPlayers(players, false); // false = replace results

                // Show "search more" button if we got results
                const loadMoreBtn = document.getElementById('loadMorePlayersBtn');
                if (players && players.length > 0) {
                    loadMoreBtn.style.display = 'block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            } catch (error) {
                showError('player', error.message);
                displayPlayers([]);
                document.getElementById('loadMorePlayersBtn').style.display = 'none';
            } finally {
                hideLoading('player');
            }
        });

        // Player input change listener
        document.getElementById('surname').addEventListener('change', () => {
            playerSearchDirty = true;
            updatePlayerSearchButton();
        });

        document.getElementById('isEditor').addEventListener('change', () => {
            playerSearchDirty = true;
            updatePlayerSearchButton();
        });

        function updatePlayerSearchButton() {
            const button = document.querySelector('#playerForm button[type="submit"]');
            if (playerSearchDirty === false) {
                button.disabled = true;
                button.style.display = 'none';
            } else {
                button.disabled = false;
                button.style.display = 'block';
            }
        }

        // Intersection input change listeners
        document.getElementById('playerId').addEventListener('change', () => {
            intersectionSearchDirty = true;
            updateIntersectionSearchButton();
        });

        document.getElementById('editorId').addEventListener('change', () => {
            intersectionSearchDirty = true;
            updateIntersectionSearchButton();
        });

        function updateIntersectionSearchButton() {
            const button = document.querySelector('#intersectionForm button[type="submit"]');
            button.disabled = intersectionSearchDirty === false;
            button.style.opacity = intersectionSearchDirty === false ? '0.5' : '1';
            button.style.cursor = intersectionSearchDirty === false ? 'not-allowed' : 'pointer';
        }


        // Load More Players Handler
        document.getElementById('loadMorePlayersBtn').addEventListener('click', async () => {
            currentPlayerPage++;

            showLoading('player', true); // true = load more mode
            clearError('player');
            clearNotification('player');

            try {
                const players = await fetchPlayers(
                    currentPlayerQuery.surname,
                    currentPlayerQuery.name,
                    currentPlayerQuery.isEditor,
                    currentPlayerPage
                );

                if (players && players.length > 0) {
                    displayPlayers(players, true); // true = append results
                } else {
                    // No more results - show notification and hide the button
                    document.getElementById('loadMorePlayersBtn').style.display = 'none';
                    showNotification('player', 'Больше результатов нет');
                }
            } catch (error) {
                showError('player', error.message);
            } finally {
                hideLoading('player', true); // true = load more mode
            }
        });

        // Fetch players from API
        async function fetchPlayers(surname, name, isEditor, page) {
            const url = new URL(API_URL);
            url.searchParams.append('surname', surname);
            if (name) {
                url.searchParams.append('name', name);
            }
            url.searchParams.append('page', page);
            url.searchParams.append('isEditor', isEditor);

            const response = await fetch(url.toString());

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            return await response.json();
        }

        // Intersection Form Handler
        document.getElementById('intersectionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset pagination
            currentTournamentPage = 1;
            const playerId = parseInt(document.getElementById('playerId').value);
            const editorId = parseInt(document.getElementById('editorId').value);

            // Store current query for pagination
            currentTournamentQuery = { playerId, editorId };

            // Reset dirty flag after successful search
            intersectionSearchDirty = false;
            updateIntersectionSearchButton();

            showLoading('intersection');
            clearError('intersection');
            clearNotification('intersection');

            try {
                const tournaments = await fetchTournaments(playerId, editorId, currentTournamentPage);
                displayTournaments(tournaments, false); // false = replace results

                // Show "search more" button if we got results
                const loadMoreBtn = document.getElementById('loadMoreTournamentsBtn');
                if (tournaments && tournaments.length > 0) {
                    loadMoreBtn.style.display = 'block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            } catch (error) {
                showError('intersection', error.message);
                displayTournaments([]);
                document.getElementById('loadMoreTournamentsBtn').style.display = 'none';
            } finally {
                hideLoading('intersection');
            }
        });

        // Load More Tournaments Handler
        document.getElementById('loadMoreTournamentsBtn').addEventListener('click', async () => {
            currentTournamentPage++;

            showLoading('intersection', true); // true = load more mode
            clearError('intersection');
            clearNotification('intersection');

            try {
                const tournaments = await fetchTournaments(
                    currentTournamentQuery.playerId,
                    currentTournamentQuery.editorId,
                    currentTournamentPage
                );

                if (tournaments && tournaments.length > 0) {
                    displayTournaments(tournaments, true); // true = append results
                } else {
                    // No more results - show notification and hide the button
                    document.getElementById('loadMoreTournamentsBtn').style.display = 'none';
                    showNotification('intersection', 'Больше результатов нет');
                }
            } catch (error) {
                showError('intersection', error.message);
            } finally {
                hideLoading('intersection', true); // true = load more mode
            }
        });

        // Fetch tournaments from API
        async function fetchTournaments(playerId, editorId, page) {
            const url = new URL(API_URL);
            url.searchParams.append('playerId', playerId);
            url.searchParams.append('editorId', editorId);
            url.searchParams.append('page', page);

            const response = await fetch(url.toString());

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            return await response.json();
        }

        // Display Players
        function displayPlayers(players, append = false) {
            const container = document.getElementById('playerResultsContainer');
            const listContainer = document.getElementById('playersResultsList');

            if (!Array.isArray(players) || players.length === 0) {
                if (!append) {
                    listContainer.innerHTML = '<div class="no-results">No players found</div>';
                    container.classList.add('show');
                }
                return;
            }

            const playersHtml = players.map(player => `
                <li class="result-item player-row">
                    <a href="https://rating.chgk.gg/b/player/${player.id}" target="_blank" class="player-link">
                        ${player.id} ${player.surname} ${player.name} ${player.patronymic || ''}
                    </a>
                    <button type="button" class="copy-id-btn" data-player-id="${player.id}" title="Скопировать ID" aria-label="Скопировать ID">⧉</button>
                </li>
            `).join('');

            if (append) {
                // Append to existing list
                const existingList = listContainer.querySelector('.result-list');
                if (existingList) {
                    existingList.insertAdjacentHTML('beforeend', playersHtml);
                } else {
                    listContainer.innerHTML = `<ul class="result-list">${playersHtml}</ul>`;
                }
            } else {
                // Replace entire list
                listContainer.innerHTML = `<ul class="result-list">${playersHtml}</ul>`;
            }

            container.classList.add('show');

            // Wire copy buttons (for newly added items)
            listContainer.querySelectorAll('.copy-id-btn').forEach(button => {
                button.addEventListener('click', () => {
                    const isEditor = document.getElementById('isEditor').checked;

                    if (isEditor) {
                        // If searching for editors, put ID in "ID редактора" field
                        const editorIdField = document.getElementById('editorId');
                        const playerId = button.getAttribute('data-player-id');
                        editorIdField.value = playerId;
                        editorIdField.focus();
                        // Trigger change event to activate search button
                        editorIdField.dispatchEvent(new Event('change', { bubbles: true }));
                    } else {
                        // If searching for players, put ID in "Ваш ID" field
                        const playerIdField = document.getElementById('playerId');
                        const playerId = button.getAttribute('data-player-id');
                        playerIdField.value = playerId;
                        playerIdField.focus();
                        // Trigger change event to activate search button
                        playerIdField.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
            });
        }

        // Display Tournaments
        function displayTournaments(tournaments, append = false) {
            const container = document.getElementById('tournamentResultsContainer');
            const listContainer = document.getElementById('tournamentsResultsList');

            if (!Array.isArray(tournaments) || tournaments.length === 0) {
                if (!append) {
                    listContainer.innerHTML = '<div class="no-results">Вы не сыграли ни одного турнира :(</div>';
                    container.classList.add('show');
                }
                return;
            }

            // Format date from ISO 8601 (e.g., 2024-12-15T00:00:00+03:00) to dd.MM.yyyy
            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                try {
                    const date = new Date(dateString);
                    if (isNaN(date.getTime())) return 'N/A';

                    const day = String(date.getDate()).padStart(2, '0');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const year = date.getFullYear();

                    return `${day}.${month}.${year}`;
                } catch (e) {
                    return 'N/A';
                }
            }

            // Get date minus 1 day for gotquestions link
            function getDateMinusOneDay(dateString) {
                if (!dateString) return '';
                try {
                    const date = new Date(dateString);
                    if (isNaN(date.getTime())) return '';

                    // Subtract 1 day
                    date.setDate(date.getDate() - 1);

                    // Format as YYYY-MM-DD
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');

                    return `${year}-${month}-${day}`;
                } catch (e) {
                    return '';
                }
            }

            // Remove (асинхрон/онлайн) and (синхрон) from tournament name
            function cleanTournamentName(name) {
                if (!name) return '';
                return name
                    .replace(/\s*\(асинхрон\/онлайн\)\s*/gi, '')
                    .replace(/\s*\(синхрон\)\s*/gi, '')
                    .trim();
            }

            const tournamentsHtml = tournaments.map(tournament => {
                const cleanedName = cleanTournamentName(tournament.name);
                const startDateMinusOne = getDateMinusOneDay(tournament.dateStart);
                const gotQuestionsUrl = `https://gotquestions.online/search?search=${encodeURIComponent(cleanedName)}&type=packs&page=1&startPlayed=${startDateMinusOne}`;

                return `
                <li class="result-item">
                    <a href="https://rating.chgk.gg/b/tournament/${tournament.id}" target="_blank" class="player-link">
                        ${tournament.id} ${tournament.name}
                    </a>
                    <div class="item-detail">
                        <strong>Дата окончания:</strong> ${formatDate(tournament.dateEnd)}
                    </div>
                    ${tournament.trueDL !== undefined ? `
                    <div class="item-detail">
                        <strong>True DL:</strong> ${tournament.trueDL}
                    </div>
                    ` : ''}
                    ${tournament.difficultyForecast !== undefined ? `
                    <div class="item-detail">
                        <strong>Прогноз сложности:</strong> ${tournament.difficultyForecast}
                    </div>
                    ` : ''}
                    ${startDateMinusOne ? `
                    <div class="item-detail">
                        <a href="${gotQuestionsUrl}" target="_blank">Поискать на GotQuestions</a>
                    </div>
                    ` : ''}
                </li>
            `}).join('');

            if (append) {
                // Append to existing list
                const existingList = listContainer.querySelector('.result-list');
                if (existingList) {
                    existingList.insertAdjacentHTML('beforeend', tournamentsHtml);
                }

                // Update stats
                const existingStats = listContainer.querySelector('.stats');
                if (existingStats) {
                    // Get all tournaments from the list to recalculate stats
                    const allTournamentElements = listContainer.querySelectorAll('.result-item');
                    const totalCount = allTournamentElements.length;

                    // Update total count
                    const totalItem = existingStats.querySelector('.stats-item:first-child strong');
                    if (totalItem && totalItem.nextSibling) {
                        totalItem.nextSibling.textContent = ` ${totalCount}`;
                    }

                    // Update oldest date (newest stays the same as it's first)
                    const tournamentsWithDate = tournaments.filter(t => t.dateEnd);
                    if (tournamentsWithDate.length > 0) {
                        const oldestNew = formatDate(tournamentsWithDate[tournamentsWithDate.length - 1].dateEnd);
                        const oldestItem = existingStats.querySelector('.stats-item:last-child strong');
                        if (oldestItem && oldestItem.nextSibling) {
                            oldestItem.nextSibling.textContent = ` ${oldestNew}`;
                        }
                    }
                }
            } else {
                // Get newest and oldest dates
                const tournamentsWithDate = tournaments.filter(t => t.dateEnd);
                const newest = tournamentsWithDate.length > 0 ? formatDate(tournamentsWithDate[0].dateEnd) : 'N/A';
                const oldest = tournamentsWithDate.length > 0 ? formatDate(tournamentsWithDate[tournamentsWithDate.length - 1].dateEnd) : 'N/A';

                // Replace entire content - stats on top
                const html = `
                    <div class="stats">
                        <div class="stats-item"><strong>Всего:</strong> ${tournaments.length}</div>
                        <div class="stats-item"><strong>Последний:</strong> ${newest}</div>
                        <div class="stats-item"><strong>Первый:</strong> ${oldest}</div>
                    </div>
                    <ul class="result-list">
                        ${tournamentsHtml}
                    </ul>
                `;
                listContainer.innerHTML = html;
            }

            container.classList.add('show');
        }

        // UI Helpers
        function showLoading(type, isLoadMore = false) {
            if (isLoadMore) {
                // Для "Искать ещё" показываем спиннер внизу
                document.getElementById(`${type}LoadingBottom`).classList.add('show');
            } else {
                // Для первого поиска показываем спиннер вверху
                document.getElementById(`${type}Loading`).classList.add('show');
            }
        }

        function hideLoading(type, isLoadMore = false) {
            if (isLoadMore) {
                document.getElementById(`${type}LoadingBottom`).classList.remove('show');
            } else {
                document.getElementById(`${type}Loading`).classList.remove('show');
            }
        }

        function showError(type, message) {
            const errorEl = document.getElementById(`${type}Error`);
            errorEl.textContent = `Error: ${message}`;
            errorEl.classList.add('show');
        }

        function clearError(type) {
            const errorEl = document.getElementById(`${type}Error`);
            errorEl.classList.remove('show');
        }

        function showNotification(type, message) {
            const notificationEl = document.getElementById(`${type}Notification`);
            notificationEl.textContent = message;
            notificationEl.classList.add('show');
        }

        function clearNotification(type) {
            const notificationEl = document.getElementById(`${type}Notification`);
            notificationEl.classList.remove('show');
        }
    </script>
</body>
</html>
